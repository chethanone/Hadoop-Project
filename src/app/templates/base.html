<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hadoop File Management{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css', v='input-picker-release-20261025') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid app-shell">
      <a class="visually-hidden" href="{{ url_for('dashboard.dashboard_view') }}">Overview</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-label="Toggle navigation">
        <i class="bi bi-list"></i>
      </button>
      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav ms-auto gap-lg-1">
          <li class="nav-item"><a class="nav-link {% if request.endpoint == 'dashboard.dashboard_view' %}active{% endif %}" href="{{ url_for('dashboard.dashboard_view') }}">Overview</a></li>
          <li class="nav-item"><a class="nav-link {% if request.endpoint == 'file_manager.file_manager_view' %}active{% endif %}" href="{{ url_for('file_manager.file_manager_view') }}">HDFS files</a></li>
          <li class="nav-item"><a class="nav-link {% if request.endpoint and request.endpoint.startswith('mapreduce.') %}active{% endif %}" href="{{ url_for('mapreduce.index') }}">MapReduce</a></li>
          <li class="nav-item"><a class="nav-link {% if request.endpoint in ('diagnostics.diagnostics_page', 'diagnostics.index') %}active{% endif %}" href="{{ url_for('diagnostics.diagnostics_page') }}">System health</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container-fluid app-shell app-main">
    {% block content %}{% endblock %}
  </main>
  <footer class="app-footer"><div class="app-shell">Hadoop 3.5 <span>·</span> Local environment</div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
